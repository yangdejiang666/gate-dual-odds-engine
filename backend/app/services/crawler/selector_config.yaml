# Gate 五分钟涨跌页面元素选择器与特征定义 (第四章)
selector_version: "2026.10.11"
check_anchor_text: "5M" # 页面锚点自检文本

selectors:
  btc:
    period_id: ".dual-period-header, .period-title, [data-testid='period-id']"
    countdown_timer: ".countdown-display, .timer-text, .time-remain"
    call_odds: ".call-odds-val, .up-multiplier, .btn-call .odds-num"
    put_odds: ".put-odds-val, .down-multiplier, .btn-put .odds-num"
    current_price: ".mark-price, .current-price-val, .index-price"
    chart_element: "canvas.chart-canvas, svg.trend-path"
    result_overlay: ".settle-result-modal, .result-tag"

  eth:
    period_id: ".dual-period-header, .period-title, [data-testid='period-id']"
    countdown_timer: ".countdown-display, .timer-text, .time-remain"
    call_odds: ".call-odds-val, .up-multiplier, .btn-call .odds-num"
    put_odds: ".put-odds-val, .down-multiplier, .btn-put .odds-num"
    current_price: ".mark-price, .current-price-val, .index-price"
    chart_element: "canvas.chart-canvas, svg.trend-path"
    result_overlay: ".settle-result-modal, .result-tag"

validation_rules:
  min_valid_odds: 1.05
  max_valid_odds: 4.50
  max_odds_step_change: 0.80 # 单秒倍率异常突变上限校验
  max_countdown_sec: 305
