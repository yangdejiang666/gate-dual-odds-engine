[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gate-dual-odds-engine"
version = "3.0.0"
description = "Gate BTC/ETH 五分钟涨跌统计与预测软件系统 (决策悬浮弹窗 + 完整Web控制台 + 实时抓取 + 状态机 + 双标的联动 + 自动验证长跑闭环)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Yang Dejiang", email = "yangdejiang666@users.noreply.github.com"}
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "websockets>=12.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.4.0",
    "lightgbm>=4.3.0",
    "duckdb>=0.10.0",
    "pyarrow>=15.0.0",
    "apscheduler>=3.10.4",
    "psutil>=5.9.8",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "aiohttp>=3.9.3",
    "jinja2>=3.1.3"
]

[project.optional-dependencies]
crawler = [
    "playwright>=1.42.0"
]
ocr = [
    "paddleocr>=2.7.0",
    "pillow>=10.0.0"
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "shared*", "tasks*"]
