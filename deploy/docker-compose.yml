version: '3.8'

services:
  engine:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: gate_dual_odds_engine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8099:8099"
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
    environment:
      - HOST=0.0.0.0
      - PORT=8099
    shm_size: '2gb'
